server {
    listen 80;
    server_name _;

    # Resolver DNS embebido de Docker. Con proxy_pass a un host fijo, Nginx
    # resolvería el DNS una sola vez al arrancar y, si el backend no está
    # levantado todavía (o cambia de IP al reiniciarse), Nginx no arranca
    # -- se cae TODO el sitio, no solo la API. Usando una variable en
    # proxy_pass (ver más abajo) se fuerza resolución en cada request, y
    # si el backend no responde el resultado es un 502 en esa llamada, no
    # la caída del contenedor entero.
    resolver 127.0.0.11 valid=10s;

    # SPA: cualquier ruta no reconocida sirve index.html (React Router, etc).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket en vivo. "carrera-server" es el container_name del backend
    # (rfid_system_carrera_del_informatico_2026); ambos stacks comparten la
    # red externa "rfid-net" para que este proxy funcione sin depender de
    # ninguna IP de LAN/Tailscale.
    location /ws/live {
        set $backend "http://carrera-server:8000";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Resto de la API del backend (ver server/main.py para la lista de rutas).
    location ~ ^/(health|events|results|race-config|runners)(/|$) {
        set $backend "http://carrera-server:8000";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
