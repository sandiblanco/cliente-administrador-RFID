services:
  cliente:
    build:
      context: ./cliente
      args:
        VITE_API_URL: http://172.24.160.5:8000
        VITE_SOCKET_URL: ws://172.24.160.6:8000/ws/live
    container_name: rfid-cliente
    restart: unless-stopped
    ports:
      # 8080 ya está en uso en el NAS de despliegue (172.24.160.6).
      - "8083:80"

  administrador:
    build:
      context: ./administrador
      args:
        VITE_SERVER_URL: http://172.24.160.5:8000
        VITE_SOCKET_URL: ws://172.24.160.6:8000/ws/live
    container_name: rfid-administrador
    restart: unless-stopped
    ports:
      - "8081:80"
