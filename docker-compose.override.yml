services:
  cliente:
    build:
      args:
        # 100.91.43.29 = Tailscale IP de esta máquina (marodriguez-desktop).
        # No usar localhost/127.0.0.1: eso resuelve a la máquina donde corre
        # el navegador, no a la que corre el backend, cuando se accede por
        # Tailscale desde otro dispositivo.
        VITE_API_URL: http://100.91.43.29:8000
        VITE_SOCKET_URL: ws://100.91.43.29:8000/ws/live

  administrador:
    build:
      args:
        VITE_SERVER_URL: http://100.91.43.29:8000
        VITE_SOCKET_URL: ws://100.91.43.29:8000/ws/live
